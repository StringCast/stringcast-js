name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { package: [web, cli] }
    defaults: { run: { working-directory: '${{ matrix.package }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '${{ matrix.package }}/package-lock.json' }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
